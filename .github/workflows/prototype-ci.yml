name: Prototype CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Python and tool contract
        run: |
          python -m py_compile experiment/services/gateway.py experiment/candidates/api.py
          python -m py_compile experiment/contracts/task_lifecycle.py
          python -m py_compile experiment/services/inference_adapter.py
          python -m py_compile experiment/scripts/gpu_trial_firewall.py experiment/scripts/seed_cp67_trial_budget.py
          python -m json.tool experiment/contracts/tools.json >/dev/null

      - name: Create ephemeral orchestrator credential
        run: |
          echo "ORCHESTRATOR_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "CP67_PYDANTIC_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')" >> "$GITHUB_ENV"
          echo "CP67_HERMES_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')" >> "$GITHUB_ENV"
          echo "CP67_LEAN_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')" >> "$GITHUB_ENV"

      - name: Validate isolated GPU route configuration
        run: HYPNOS_INFERENCE_UPSTREAM=http://hypnos.invalid:11434 docker compose --profile gpu-trial -f experiment/compose.yaml -f experiment/compose.gpu-trial.yaml config --quiet

      - name: Start disposable fixtures
        run: docker compose -f experiment/compose.yaml up -d --build postgres grocy commitment-simulator workspace-amber workspace-cobalt tool-gateway

      - name: Initialize synthetic Grocy data
        run: |
          docker compose -f experiment/compose.yaml exec -T grocy sh /opt/hades-v3-scripts/initialize_grocy.sh
          docker compose -f experiment/compose.yaml exec -T grocy sh /opt/hades-v3-scripts/seed_grocy_data.sh

      - name: Run gateway integration test
        run: docker compose -f experiment/compose.yaml run --build --rm test-runner python /app/tests/test_gateway.py

      - name: Run task lifecycle contract tests
        run: docker compose -f experiment/compose.yaml run --build --rm test-runner python /app/tests/test_task_lifecycle.py

      - name: Run candidate task finalization tests
        run: docker compose -f experiment/compose.yaml run --build --rm test-runner python /app/tests/test_candidate_finalization.py

      - name: Run isolated inference adapter security tests
        run: docker compose -f experiment/compose.yaml run --build --rm test-runner python /app/tests/test_inference_adapter.py

      - name: Remove disposable services and volumes
        if: always()
        run: docker compose -f experiment/compose.yaml down --volumes --remove-orphans
