name: Prototype CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: hades-v3-ci-${{ github.run_id }}-${{ github.run_attempt }}
      A2_COMPOSE_PROJECT_NAME: hades-v3-exp-a2-${{ github.run_id }}-${{ github.run_attempt }}
      CP79_COMPOSE_PROJECT_NAME: hades-v3-exp-cp79-${{ github.run_id }}-${{ github.run_attempt }}
      CP83_COMPOSE_PROJECT_NAME: hades-v3-exp-cp83-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Python and tool contract
        run: |
          python -m py_compile experiment/services/gateway.py experiment/services/commitment_simulator.py experiment/candidates/api.py experiment/candidates/mcp_proxy.py experiment/candidates/test_workspace_identity.py experiment/contracts/memory_schema.py experiment/contracts/memory_diagnostics.py experiment/tests/test_commitment_recovery.py experiment/tests/run_family8_restart_recovery.py experiment/tests/run_cp73_completion_recovery.py experiment/tests/run_cp74_fresh_memory_recall.py experiment/tests/run_cp75_memory_cas_case.py experiment/tests/run_cp81_memory_case.py experiment/tests/test_cp81_memory_runner.py experiment/spikes/cp77_durable_execution_probe.py experiment/spikes/a2_gateway_workspace/operation_identity.py experiment/spikes/a2_gateway_workspace/recovery_gate.py experiment/spikes/a2_gateway_workspace/test_resume_gate.py experiment/spikes/cp83_a2_dbos_workspace/test_durable_shell_recovery.py
          python -m py_compile experiment/contracts/task_lifecycle.py
          python -m py_compile experiment/services/inference_adapter.py
          python -m py_compile experiment/services/ollama_protocol.py
          python -m py_compile experiment/scripts/gpu_trial_firewall.py experiment/scripts/seed_cp67_trial_budget.py experiment/tests/test_gpu_trial_firewall.py experiment/tests/test_seed_trial_budget.py
          python -m py_compile experiment/scripts/hypnos_gpu_preflight.py experiment/tests/test_hypnos_gpu_preflight.py
          python -m py_compile experiment/tests/scripted_ollama.py experiment/tests/run_cp68_e2e.py experiment/tests/test_ollama_protocol.py experiment/tests/compose_scope.py experiment/tests/test_compose_scope.py experiment/tests/run_family2_eggs_oats_screen.py experiment/tests/run_family3_cp64_unavailable.py experiment/tests/run_family4_cp60_screen.py experiment/tests/run_family5_workspace_screen.py experiment/tests/run_family6_restart.py experiment/tests/run_family7_denial_screen.py experiment/tests/run_family8_ack_loss_pilot.py
          python -m json.tool experiment/contracts/tools.json >/dev/null

      - name: Run isolated DBOS process-recovery contract probe
        run: |
          python -m pip install -r experiment/spikes/cp77_durable_execution/requirements.txt
          python experiment/spikes/cp77_durable_execution_probe.py

      - name: Create ephemeral orchestrator credential
        run: |
          set +x
          while IFS=: read -r name length; do
            value="$(python -c "import secrets; print(secrets.token_urlsafe($length))")"
            printf '::add-mask::%s\n' "$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done <<'EOF'
          ORCHESTRATOR_SECRET:48
          CP67_PYDANTIC_KEY:24
          CP67_HERMES_KEY:24
          CP67_LEAN_KEY:24
          CP68_PYDANTIC_KEY:24
          CP68_HERMES_KEY:24
          CP68_LEAN_KEY:24
          CP69_PYDANTIC_KEY:24
          CP69_HERMES_KEY:24
          CP69_LEAN_KEY:24
          EOF

      - name: Validate isolated GPU route configuration
        run: HYPNOS_INFERENCE_UPSTREAM=http://hypnos.invalid:11434 docker compose -p "$COMPOSE_PROJECT_NAME" --profile gpu-trial -f experiment/compose.yaml -f experiment/compose.gpu-trial.yaml config --quiet

      - name: Start disposable fixtures
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f experiment/compose.yaml up -d --build postgres grocy commitment-simulator workspace-amber workspace-cobalt tool-gateway

      - name: Initialize synthetic Grocy data
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" -f experiment/compose.yaml exec -T grocy sh /opt/hades-v3-scripts/initialize_grocy.sh
          docker compose -p "$COMPOSE_PROJECT_NAME" -f experiment/compose.yaml exec -T grocy sh /opt/hades-v3-scripts/seed_grocy_data.sh

      - name: Run gateway integration test
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f experiment/compose.yaml run --build --rm test-runner python /app/tests/test_gateway.py

      - name: Run isolated workspace command contract test
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f experiment/compose.yaml run --build --rm test-runner python /app/tests/test_workspace_flow.py

      - name: Run uncertain commitment recovery regression
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f experiment/compose.yaml run --build --rm test-runner python /app/tests/test_commitment_recovery.py

      - name: Run task lifecycle contract tests
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f experiment/compose.yaml run --build --rm test-runner python /app/tests/test_task_lifecycle.py

      - name: Run CP81 synthetic answer oracle tests
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f experiment/compose.yaml run --build --rm test-runner python /app/tests/test_cp81_memory_runner.py

      - name: Run candidate task finalization tests
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f experiment/compose.yaml run --build --rm test-runner python /app/tests/test_candidate_finalization.py

      - name: Run isolated inference adapter security tests
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f experiment/compose.yaml run --build --rm test-runner python /app/tests/test_inference_adapter.py

      - name: Run Hypnos user-service preflight regression tests
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f experiment/compose.yaml run --build --rm test-runner python /app/tests/test_hypnos_gpu_preflight.py

      - name: Run CP71 firewall and durable budget contract tests
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" -f experiment/compose.yaml run --build --rm test-runner python /app/tests/test_gpu_trial_firewall.py
          docker compose -p "$COMPOSE_PROJECT_NAME" -f experiment/compose.yaml run --build --rm test-runner python /app/tests/test_seed_trial_budget.py

      - name: Run native Ollama tool-history protocol tests
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f experiment/compose.yaml run --build --rm test-runner python /app/tests/test_ollama_protocol.py

      - name: Run isolated Compose project-scope tests
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f experiment/compose.yaml run --build --rm --no-deps test-runner python /app/tests/test_compose_scope.py

      - name: Remove disposable services and volumes
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f experiment/compose.yaml down --volumes --remove-orphans

      - name: Start isolated A2 workspace fixtures
        run: docker compose -p "$A2_COMPOSE_PROJECT_NAME" --profile a2-harness -f experiment/compose.yaml -f experiment/compose.a2-harness.yaml up -d --build postgres grocy commitment-simulator workspace-amber workspace-cobalt tool-gateway

      - name: Build isolated A2 workspace runner
        run: docker compose -p "$A2_COMPOSE_PROJECT_NAME" --profile a2-harness -f experiment/compose.yaml -f experiment/compose.a2-harness.yaml build a2-harness-runner

      - name: Verify A2 shell does not repeat a quarantined command
        run: docker compose -p "$A2_COMPOSE_PROJECT_NAME" --profile a2-harness -f experiment/compose.yaml -f experiment/compose.a2-harness.yaml run --rm --no-deps -e A2_TOOL_PROFILE=shell_only a2-harness-runner python /app/test_uncertain_shell.py

      - name: Verify A2 Shell can forward durable invocation identity
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            "${A2_COMPOSE_PROJECT_NAME}-a2-harness-runner" python /app/test_operation_identity_context.py

      - name: Verify A2 StepPersistence quarantines interrupted Shell calls
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory=2g --pids-limit=64 --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            "${A2_COMPOSE_PROJECT_NAME}-a2-harness-runner" python /app/test_step_persistence_interrupted_shell.py

      - name: Verify HADES-aware interrupted-call resume gate
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory=2g --pids-limit=64 --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            "${A2_COMPOSE_PROJECT_NAME}-a2-harness-runner" python /app/test_resume_gate.py

      - name: Verify A2 Shell retries a confirmed call without redispatch
        run: docker compose -p "$A2_COMPOSE_PROJECT_NAME" --profile a2-harness -f experiment/compose.yaml -f experiment/compose.a2-harness.yaml run --rm --no-deps a2-harness-runner python /app/test_confirmed_command_recovery.py

      - name: Run Pydantic Harness gateway workspace contract probe
        run: |
          for profile in shell_filesystem shell_only shell_only shell_filesystem shell_filesystem shell_only; do
            docker compose -p "$A2_COMPOSE_PROJECT_NAME" --profile a2-harness -f experiment/compose.yaml -f experiment/compose.a2-harness.yaml run --rm --no-deps -e "A2_TOOL_PROFILE=$profile" a2-harness-runner
            docker compose -p "$A2_COMPOSE_PROJECT_NAME" --profile a2-harness -f experiment/compose.yaml -f experiment/compose.a2-harness.yaml run --rm --no-deps -e WORKSPACE_RESET=1 workspace-amber
          done

      - name: Remove isolated A2 workspace fixtures
        if: always()
        run: docker compose -p "$A2_COMPOSE_PROJECT_NAME" --profile a2-harness -f experiment/compose.yaml -f experiment/compose.a2-harness.yaml down --volumes --remove-orphans

      - name: Start isolated CP79 gateway fixtures
        run: docker compose -p "$CP79_COMPOSE_PROJECT_NAME" --profile cp79-dbos -f experiment/compose.yaml -f experiment/compose.cp79-dbos.yaml up -d --build postgres grocy commitment-simulator workspace-amber workspace-cobalt tool-gateway

      - name: Create CP79 synthetic tasks and exact approvals
        run: docker compose -p "$CP79_COMPOSE_PROJECT_NAME" --profile cp79-dbos -f experiment/compose.yaml -f experiment/compose.cp79-dbos.yaml run --build --rm --no-deps cp79-dbos-setup

      - name: Resume CP79 DBOS workflows after accepted-effect process death
        run: docker compose -p "$CP79_COMPOSE_PROJECT_NAME" --profile cp79-dbos -f experiment/compose.yaml -f experiment/compose.cp79-dbos.yaml run --build --rm --no-deps cp79-dbos-worker

      - name: Independently verify CP79 task, grant, effect, and target state
        run: docker compose -p "$CP79_COMPOSE_PROJECT_NAME" --profile cp79-dbos -f experiment/compose.yaml -f experiment/compose.cp79-dbos.yaml run --build --rm --no-deps cp79-dbos-verify

      - name: Remove isolated CP79 DBOS fixtures and workflow state
        if: always()
        run: docker compose -p "$CP79_COMPOSE_PROJECT_NAME" --profile cp79-dbos -f experiment/compose.yaml -f experiment/compose.cp79-dbos.yaml down --volumes --remove-orphans --timeout 5

      - name: Start isolated CP83 Pydantic DBOS workspace fixtures
        run: docker compose -p "$CP83_COMPOSE_PROJECT_NAME" -f experiment/compose.yaml up -d --build postgres grocy commitment-simulator workspace-amber workspace-cobalt tool-gateway

      - name: Verify upstream Pydantic DBOSDurability with HADES Shell workspace
        run: docker compose -p "$CP83_COMPOSE_PROJECT_NAME" --profile cp83-dbos-harness -f experiment/compose.yaml -f experiment/compose.cp83-dbos-harness.yaml run --build --rm --no-deps cp83-dbos-harness-runner

      - name: Remove isolated CP83 Pydantic DBOS workspace fixtures
        if: always()
        run: docker compose -p "$CP83_COMPOSE_PROJECT_NAME" --profile cp83-dbos-harness -f experiment/compose.yaml -f experiment/compose.cp83-dbos-harness.yaml down --volumes --remove-orphans --timeout 5

      - name: Validate isolated CP69 offline profile
        run: docker compose -p "${COMPOSE_PROJECT_NAME}-cp69offline" --profile cp68-offline -f experiment/compose.yaml -f experiment/compose.cp68-offline.yaml config --quiet

      - name: Run strict three-harness offline end-to-end qualification
        run: |
          docker compose -p "${COMPOSE_PROJECT_NAME}-cp69offline" --profile cp68-offline -f experiment/compose.yaml -f experiment/compose.cp68-offline.yaml up -d --build postgres grocy commitment-simulator workspace-amber workspace-cobalt tool-gateway cp68-scripted-ollama cp68-inference-adapter cp68-hermes-amber cp68-candidate-api
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 64 --memory 1g --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            "${COMPOSE_PROJECT_NAME}-cp69offline-cp68-candidate-api" python /app/candidates/test_workspace_identity.py
          docker compose -p "${COMPOSE_PROJECT_NAME}-cp69offline" --profile cp68-offline -f experiment/compose.yaml -f experiment/compose.cp68-offline.yaml run --build --rm cp68-e2e-runner --output /tmp/cp69_offline_e2e.jsonl

      - name: Remove isolated CP69 fixtures and volumes
        if: always()
        run: docker compose -p "${COMPOSE_PROJECT_NAME}-cp69offline" --profile cp68-offline -f experiment/compose.yaml -f experiment/compose.cp68-offline.yaml down --volumes --remove-orphans
