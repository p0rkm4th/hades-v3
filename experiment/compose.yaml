name: hades-v3-lab

services:
  postgres:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: hades_lab
      POSTGRES_USER: fixture_writer
      POSTGRES_PASSWORD: disposable-only-not-a-secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./fixtures/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixture_writer -d hades_lab"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [fixture-backend]
    restart: "no"

  grocy:
    image: ghcr.io/linuxserver/grocy:v4.7.1-ls342@sha256:3c1ce96cb2d0f0c7ea0c2e0b89f5769be7f2f102204fbeef87aeef56afd6036e
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      APP_URL: http://127.0.0.1
    volumes:
      - grocy-data:/config
      - grocy-api-key:/run/fixture-secrets
      - ./scripts:/opt/hades-v3-scripts:ro
    networks: [fixture-backend]
    restart: "no"

  commitment-simulator:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["python", "/app/commitment_simulator.py"]
    environment:
      DATABASE_URL: postgresql://fixture_writer:disposable-only-not-a-secret@postgres:5432/hades_lab
      COMMITMENT_API_TOKEN: ${COMMITMENT_API_TOKEN:-fixture-only-token-not-a-secret}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [fixture-backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 15
    restart: "no"

  workspace-amber:
    build:
      context: .
      dockerfile: services/Workspace.Dockerfile
    environment:
      FIXTURE_USER: user-amber
      WORKSPACE_ROOT: /workspace
    volumes:
      - workspace-amber-data:/workspace
    networks: [workspace-amber-net]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 2g
    ulimits:
      fsize:
        soft: 268435456
        hard: 268435456
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 15
    restart: "no"

  workspace-cobalt:
    build:
      context: .
      dockerfile: services/Workspace.Dockerfile
    environment:
      FIXTURE_USER: user-cobalt
      WORKSPACE_ROOT: /workspace
    volumes:
      - workspace-cobalt-data:/workspace
    networks: [workspace-cobalt-net]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 2g
    ulimits:
      fsize:
        soft: 268435456
        hard: 268435456
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 15
    restart: "no"

  fixture-admin:
    build:
      context: .
      dockerfile: services/Admin.Dockerfile
    profiles: [fixture-admin]
    environment:
      DATABASE_URL: postgresql://fixture_writer:disposable-only-not-a-secret@postgres:5432/hades_lab
    depends_on:
      postgres:
        condition: service_healthy
    networks: [fixture-backend]
    restart: "no"

  tool-gateway:
    build:
      context: .
      dockerfile: services/Dockerfile
    environment:
      DATABASE_URL: postgresql://fixture_writer:disposable-only-not-a-secret@postgres:5432/hades_lab
      GROCY_URL: http://grocy
      GROCY_API_KEY_FILE: /run/fixture-secrets/grocy-api-key
      COMMITMENT_URL: http://commitment-simulator:8090
      COMMITMENT_API_TOKEN: ${COMMITMENT_API_TOKEN:-fixture-only-token-not-a-secret}
      WORKSPACE_AMBER_URL: http://workspace-amber:8091
      WORKSPACE_COBALT_URL: http://workspace-cobalt:8091
      TOOLS_PATH: /app/tools.json
    volumes:
      - grocy-api-key:/run/fixture-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      grocy:
        condition: service_started
      commitment-simulator:
        condition: service_healthy
      workspace-amber:
        condition: service_healthy
      workspace-cobalt:
        condition: service_healthy
    networks: [fixture-backend, workspace-amber-net, workspace-cobalt-net, operator]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 15
    restart: "no"

  model-server-8b:
    image: ghcr.io/ggml-org/llama.cpp@sha256:fc9b506e89c1a1cfdd7bc056480f54dc657c1c04d76839a08642dc280b8ed2f6
    profiles: [model-8b]
    command:
      - --model
      - /models/Qwen3-8B-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "40960"
      - --threads
      - "16"
      - --threads-batch
      - "16"
      - --reasoning
      - off
      - --no-webui
    volumes:
      - ./models:/models:ro
    networks: [operator]
    healthcheck:
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 2s
      retries: 30
    restart: "no"

  model-server-14b:
    image: ghcr.io/ggml-org/llama.cpp@sha256:fc9b506e89c1a1cfdd7bc056480f54dc657c1c04d76839a08642dc280b8ed2f6
    profiles: [model-14b]
    command:
      - --model
      - /models/Qwen3-14B-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "40960"
      - --threads
      - "16"
      - --threads-batch
      - "16"
      - --reasoning
      - off
      - --no-webui
    volumes:
      - ./models:/models:ro
    networks: [operator]
    healthcheck:
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 2s
      retries: 30
    restart: "no"

  test-runner:
    build:
      context: .
      dockerfile: services/Test.Dockerfile
    depends_on:
      tool-gateway:
        condition: service_healthy
    networks: [operator]
    restart: "no"

  candidate-api:
    build:
      context: .
      dockerfile: candidates/Candidate.Dockerfile
    profiles: [harness]
    environment:
      GATEWAY_URL: http://tool-gateway:8080
      MODEL_URL: ${MODEL_URL:-http://model-server-8b:8080/v1}
      MODEL_NAME: ${MODEL_NAME:-Qwen3-8B}
      MODEL_REQUEST_TIMEOUT_SECONDS: ${MODEL_REQUEST_TIMEOUT_SECONDS:-50}
    volumes:
      - hermes-amber-task:/hermes/amber-task
      - hermes-amber-trace:/hermes/amber-trace
      - hermes-cobalt-task:/hermes/cobalt-task
      - hermes-cobalt-trace:/hermes/cobalt-trace
    depends_on:
      tool-gateway:
        condition: service_healthy
    networks: [operator]
    restart: "no"

  hermes-amber:
    build:
      context: .
      dockerfile: candidates/Hermes.Dockerfile
    profiles: [harness]
    environment:
      API_SERVER_KEY: fixture-hermes-amber
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: fixture
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: fixture-dashboard-hermes
      DASHBOARD_PASSWORD: fixture-dashboard-hermes
      HADES_USER_TOKEN: fixture-token-amber
      HADES_TASK_FILE: /var/hades-task/current
      HADES_TRACE_FILE: /var/hades-trace/tool-trace.jsonl
      MODEL_URL: ${MODEL_URL:-http://model-server-8b:8080/v1}
      MODEL_NAME: ${MODEL_NAME:-Qwen3-8B}
      MODEL_CONTEXT_LENGTH: ${MODEL_CONTEXT_LENGTH:-40960}
    volumes:
      - hermes-amber-home:/home/hermes/.hermes
      - hermes-amber-task:/var/hades-task
      - hermes-amber-trace:/var/hades-trace
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      tool-gateway:
        condition: service_healthy
    networks: [operator]
    restart: "no"

  hermes-cobalt:
    build:
      context: .
      dockerfile: candidates/Hermes.Dockerfile
    profiles: [harness]
    environment:
      API_SERVER_KEY: fixture-hermes-cobalt
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: fixture
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: fixture-dashboard-hermes
      DASHBOARD_PASSWORD: fixture-dashboard-hermes
      HADES_USER_TOKEN: fixture-token-cobalt
      HADES_TASK_FILE: /var/hades-task/current
      HADES_TRACE_FILE: /var/hades-trace/tool-trace.jsonl
      MODEL_URL: ${MODEL_URL:-http://model-server-8b:8080/v1}
      MODEL_NAME: ${MODEL_NAME:-Qwen3-8B}
    volumes:
      - hermes-cobalt-home:/home/hermes/.hermes
      - hermes-cobalt-task:/var/hades-task
      - hermes-cobalt-trace:/var/hades-trace
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      tool-gateway:
        condition: service_healthy
    networks: [operator]
    restart: "no"

  candidate-runner:
    build:
      context: .
      dockerfile: services/Test.Dockerfile
    profiles: [harness]
    entrypoint: ["python", "/app/candidates/run_trial.py"]
    volumes:
      - ./candidates:/app/candidates:ro
    depends_on:
      candidate-api:
        condition: service_started
    networks: [operator]
    restart: "no"

volumes:
  postgres-data:
  grocy-data:
  grocy-api-key:
  workspace-amber-data:
  workspace-cobalt-data:
  hermes-amber-task:
  hermes-amber-trace:
  hermes-cobalt-task:
  hermes-cobalt-trace:
  hermes-amber-home:
  hermes-cobalt-home:

networks:
  fixture-backend:
    internal: true
  workspace-amber-net:
    internal: true
  workspace-cobalt-net:
    internal: true
  operator:
    internal: true
