name: hades-v3-lab

services:
  gpu-inference-adapter:
    image: hades-v3-cp67-inference-adapter
    build:
      context: .
      dockerfile: services/InferenceAdapter.Dockerfile
    environment:
      OLLAMA_UPSTREAM: ${HYPNOS_INFERENCE_UPSTREAM:?set the verified Hypnos URL in the local environment}
      MODEL_ID: gemma4:12b
      UPSTREAM_TIMEOUT_SECONDS: "120"
      TRIAL_STATE_FILE: /run/cp67-state/budget.json
      CP67_PYDANTIC_KEY: ${CP67_PYDANTIC_KEY:?set a fresh per-trial adapter key}
      CP67_HERMES_KEY: ${CP67_HERMES_KEY:?set a fresh per-trial adapter key}
      CP67_LEAN_KEY: ${CP67_LEAN_KEY:?set a fresh per-trial adapter key}
    volumes:
      - cp67-trial-state:/run/cp67-state
    networks:
      - gpu-model-access
      - gpu-egress
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    restart: "no"

  gpu-candidate-api:
    image: hades-v3-cp67-candidate-api
    build:
      context: .
      dockerfile: candidates/Candidate.Dockerfile
    profiles: [gpu-trial]
    environment:
      GATEWAY_URL: http://tool-gateway:8080
      MODEL_URL: http://gpu-inference-adapter:8098/v1
      MODEL_NAME: gemma4:12b
      MODEL_CONTEXT_LENGTH: "65536"
      MODEL_REQUEST_TIMEOUT_SECONDS: "125"
      MODEL_TEMPERATURE: "0"
      MODEL_MAX_TOKENS: "1024"
      MODEL_MAX_REQUESTS: "2"
      MODEL_API_KEY: ${CP67_PYDANTIC_KEY:?set a fresh per-trial adapter key}
      MODEL_API_KEY_LEAN: ${CP67_LEAN_KEY:?set a fresh per-trial adapter key}
      HERMES_AMBER_ENDPOINT: http://gpu-hermes-amber:8642/v1/chat/completions
      ORCHESTRATOR_SECRET: ${ORCHESTRATOR_SECRET:?set the existing local orchestrator secret}
    volumes:
      - cp67-hermes-task:/hermes/amber-task
      - cp67-hermes-trace:/hermes/amber-trace
    networks: [operator, gpu-model-access]
    depends_on:
      tool-gateway:
        condition: service_healthy
      gpu-inference-adapter:
        condition: service_started
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    restart: "no"

  gpu-hermes-amber:
    image: hades-v3-cp67-hermes
    build:
      context: .
      dockerfile: candidates/Hermes.Dockerfile
    profiles: [gpu-trial]
    environment:
      API_SERVER_KEY: fixture-hermes-amber
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: fixture
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: fixture-dashboard-hermes
      DASHBOARD_PASSWORD: fixture-dashboard-hermes
      HADES_USER_TOKEN: fixture-token-amber
      HADES_TASK_FILE: /var/hades-task/current
      HADES_TRACE_FILE: /var/hades-trace/tool-trace.jsonl
      MODEL_URL: http://gpu-inference-adapter:8098/v1
      MODEL_NAME: gemma4:12b
      MODEL_CONTEXT_LENGTH: "65536"
      MODEL_TEMPERATURE: "0"
      MODEL_MAX_TOKENS: "1024"
      MODEL_API_KEY: ${CP67_HERMES_KEY:?set a fresh per-trial adapter key}
      MODEL_REQUEST_TIMEOUT_SECONDS: "125"
      ORCHESTRATOR_SECRET: ${ORCHESTRATOR_SECRET:?set the existing local orchestrator secret}
    volumes:
      - cp67-hermes-home:/home/hermes/.hermes
      - cp67-hermes-task:/var/hades-task
      - cp67-hermes-trace:/var/hades-trace
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    networks: [operator, gpu-model-access]
    depends_on:
      tool-gateway:
        condition: service_healthy
      gpu-inference-adapter:
        condition: service_started
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 3g
    restart: "no"

  gpu-trial-runner:
    image: hades-v3-cp67-candidate-api
    profiles: [gpu-trial]
    entrypoint: ["python", "/app/candidates/run_trial.py"]
    volumes:
      - ./candidates:/app/candidates:ro
    environment:
      CANDIDATE_API_URL: http://gpu-candidate-api:8080/api/turn
    networks: [operator]
    depends_on:
      gpu-candidate-api:
        condition: service_started
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    restart: "no"

networks:
  gpu-model-access:
    name: hades-v3-gpu-model-access
    driver: bridge
    internal: true
  gpu-egress:
    name: hades-v3-gpu-egress
    driver: bridge

volumes:
  cp67-trial-state:
  cp67-hermes-home:
  cp67-hermes-task:
  cp67-hermes-trace:
