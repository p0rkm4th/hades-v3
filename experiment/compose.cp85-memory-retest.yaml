services:
  model-server-8b:
    cpus: 4.0
    mem_limit: 12g

  test-runner:
    volumes:
      - ./tests/run_cp81_memory_case.py:/app/tests/run_cp81_memory_case.py:ro
      - ./tests/test_cp81_memory_runner.py:/app/tests/test_cp81_memory_runner.py:ro
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 96
    mem_limit: 1g
    cpus: 1.0
